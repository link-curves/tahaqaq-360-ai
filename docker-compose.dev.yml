# ==================================
# Docker Compose - Development
# ==================================
# Hot-reload enabled for local development

version: "3.9"

services:
  # ---------------------------------
  # PostgreSQL Database
  # ---------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tahaqaq-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: tahaqaq
      POSTGRES_PASSWORD: tahaqaq_dev
      POSTGRES_DB: tahaqaq_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tahaqaq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tahaqaq-network

  # ---------------------------------
  # NestJS API Backend (Dev Mode)
  # ---------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: tahaqaq-api-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tahaqaq:tahaqaq_dev@postgres:5432/tahaqaq_dev?schema=public
      DATABASE_DIRECT_URL: postgresql://tahaqaq:tahaqaq_dev@postgres:5432/tahaqaq_dev?schema=public
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      JWT_ACCESS_SECRET: dev-secret-key
      JWT_REFRESH_SECRET: dev-refresh-secret
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tahaqaq-network
    command: sh -c "cd apps/api && pnpm db:generate && pnpm dev"

  # ---------------------------------
  # React + Vite Frontend (Dev Mode)
  # ---------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    container_name: tahaqaq-web-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - tahaqaq-network
    command: sh -c "cd apps/web && pnpm dev --host"

volumes:
  postgres_data_dev:
    driver: local

networks:
  tahaqaq-network:
    driver: bridge
