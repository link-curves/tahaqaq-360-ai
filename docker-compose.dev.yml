# ==================================
# Docker Compose - Development
# ==================================
# Hot-reload enabled for local development

version: "3.9"

services:
  # ---------------------------------
  # PostgreSQL Database (COMMENTED OUT - Using Supabase)
  # ---------------------------------
  # Uncomment this section if you want to use local PostgreSQL instead of Supabase
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: tahaqaq-db-dev
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: tahaqaq
  #     POSTGRES_PASSWORD: tahaqaq_dev
  #     POSTGRES_DB: tahaqaq_dev
  #     PGDATA: /var/lib/postgresql/data/pgdata
  #   volumes:
  #     - postgres_data_dev:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U tahaqaq -d tahaqaq_dev"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - tahaqaq-network

  # ---------------------------------
  # NestJS API Backend (Dev Mode)
  # ---------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: tahaqaq-api-dev
    restart: unless-stopped
    # Credentials come from .env.dev (git-ignored). Copy .env.dev.example to
    # .env.dev and fill it in. Never hardcode connection strings here.
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - see .env.dev.example}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:?DATABASE_DIRECT_URL is required - see .env.dev.example}
      NODE_ENV: development
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000,http://localhost:3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules
    ports:
      - "5000:5000"
    networks:
      - tahaqaq-network
    command: sh -c "cd apps/api && pnpm db:generate && pnpm db:deploy && pnpm dev"

  # ---------------------------------
  # React + Vite Frontend (Dev Mode)
  # ---------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    container_name: tahaqaq-web-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - tahaqaq-network
    command: sh -c "cd apps/web && pnpm dev --host"

  # ---------------------------------
  # Admin Panel (Dev Mode)
  # ---------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.prod
      target: builder
    container_name: tahaqaq-admin-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    volumes:
      - ./apps/admin:/app/apps/admin
      - /app/node_modules
      - /app/apps/admin/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - api
    networks:
      - tahaqaq-network
    command: sh -c "cd apps/admin && pnpm dev --host --port 3001"

# Volumes (commented out since using Supabase)
# volumes:
#   postgres_data_dev:
#     driver: local

networks:
  tahaqaq-network:
    driver: bridge
