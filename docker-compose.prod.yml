# ==================================
# Docker Compose - Production
# ==================================
# Full stack deployment with PostgreSQL, API, and Web

version: "3.9"

services:
  # ---------------------------------
  # PostgreSQL Database
  # ---------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tahaqaq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tahaqaq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tahaqaq_password}
      POSTGRES_DB: ${POSTGRES_DB:-tahaqaq_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tahaqaq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tahaqaq-network

  # ---------------------------------
  # NestJS API Backend
  # ---------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: tahaqaq-api
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-tahaqaq}:${POSTGRES_PASSWORD:-tahaqaq_password}@postgres:5432/${POSTGRES_DB:-tahaqaq_db}?schema=public
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-tahaqaq}:${POSTGRES_PASSWORD:-tahaqaq_password}@postgres:5432/${POSTGRES_DB:-tahaqaq_db}?schema=public

      # App
      NODE_ENV: production
      PORT: 5000

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}

      # JWT
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-change-in-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      # Supabase Storage
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-tahaqaq-uploads}

      # Rate Limiting
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}

      # Email (Optional)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tahaqaq-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running database migrations...' &&
        cd apps/api && npx prisma migrate deploy --schema=src/prisma/schema.prisma &&
        echo 'Starting API server...' &&
        node apps/api/dist/main.js
      "

  # ---------------------------------
  # React + Vite Frontend (Nginx)
  # ---------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: tahaqaq-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - tahaqaq-network

  # ---------------------------------
  # Admin Panel (Nginx)
  # ---------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: tahaqaq-admin
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      - api
    networks:
      - tahaqaq-network

# ---------------------------------
# Volumes
# ---------------------------------
volumes:
  postgres_data:
    driver: local

# ---------------------------------
# Networks
# ---------------------------------
networks:
  tahaqaq-network:
    driver: bridge
